<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arrows Master – Play</title>
    <style>
        /* ─── Reset & Base ──────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        /* ─── HUD ───────────────────────────────────────────────────── */
        #hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(8px, 2vw, 14px) clamp(12px, 3vw, 20px) clamp(4px, 1vw, 8px);
            flex-shrink: 0;
            background: #fff;
            border-bottom: 1.5px solid rgba(0, 0, 0, 0.08);
            z-index: 100;
        }

        #hearts-container {
            display: flex;
            gap: clamp(4px, 1.2vw, 8px);
        }

        .heart {
            width: clamp(22px, 5vw, 32px);
            height: clamp(22px, 5vw, 32px);
            background-image: url('resources/sprites/heart.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: opacity .25s, filter .25s;
        }

        .heart.inactive {
            opacity: .22;
        }

        #timer-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #timer-container.visible {
            display: flex;
        }

        #timer-label {
            font-size: clamp(8px, 1.8vw, 11px);
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #timer-text {
            font-size: clamp(18px, 4.5vw, 26px);
            font-weight: 700;
            color: #111;
            font-variant-numeric: tabular-nums;
        }

        #timer-text.warning {
            color: #e74c3c;
            animation: timerPulse .6s ease-in-out infinite alternate;
        }

        @keyframes timerPulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.12);
            }
        }

        #arrows-left-holder {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #arrows-left-label {
            font-size: clamp(8px, 1.8vw, 11px);
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #arrows-left-text {
            font-size: clamp(18px, 4.5vw, 26px);
            font-weight: 700;
            color: #111;
        }

        @keyframes punchFeedback {
            0% {
                transform: translate(-50%, -50%) scale(0.6);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.35);
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .punch {
            animation: punchFeedback 0.22s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes punchSimple {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4);
            }

            100% {
                transform: scale(1);
            }
        }

        .punch-simple {
            animation: punchSimple .14s;
        }

        #streak-bar {
            width: 100%;
            height: clamp(4px, 1vw, 6px);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.05);
            z-index: 100;
        }

        #streak-fill {
            position: absolute;
            left: 0;
            top: 0;
            width: 0%;
            height: 100%;
            border-radius: 3px;
            transition: width .25s, background-color .2s;
        }

        #canvas-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
            opacity: 0;
            transition: opacity .4s;
        }

        #canvas-wrap.ready {
            opacity: 1;
        }

        canvas#gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        canvas#gameCanvas:active {
            cursor: grabbing;
        }

        .overlay-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.95);
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: opacity .3s;
        }

        .overlay-screen.visible {
            opacity: 1;
            pointer-events: all;
        }

        .overlay-screen h1 {
            font-size: clamp(26px, 7vw, 42px);
            font-weight: 900;
            color: #111;
            margin-bottom: 8px;
            text-align: center;
        }

        .overlay-screen p {
            font-size: clamp(13px, 3vw, 17px);
            color: #555;
            text-align: center;
            max-width: min(300px, 80vw);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .btn {
            padding: clamp(12px, 3vw, 16px) clamp(28px, 7vw, 44px);
            border-radius: 50px;
            font-size: clamp(15px, 3.5vw, 19px);
            font-weight: 800;
            cursor: pointer;
            border: none;
            transition: transform .1s;
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: scale(.93);
        }

        .btn-primary {
            background: #111;
            color: #fff;
        }

        #wrong-flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 250;
            background: rgba(231, 76, 60, 0);
            transition: background .1s;
        }

        #wrong-flash.flash {
            background: rgba(231, 76, 60, 0.22);
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            z-index: 500;
            flex-direction: column;
            gap: 14px;
            transition: opacity .4s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading p {
            color: #aaa;
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        .spin {
            width: 38px;
            height: 38px;
            border: 3.5px solid rgba(0, 0, 0, 0.08);
            border-top-color: #111;
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ─── Feedback (Vibe/Combo) ─────────────────────────────────── */
        #feedback-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 400;
        }

        .feedback-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(34px, 9vw, 62px);
            font-weight: 900;
            color: #111;
            text-transform: uppercase;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .feedback-text.show {
            opacity: 1;
        }

        .combo-text {
            position: fixed;
            font-size: clamp(22px, 6vw, 36px);
            font-weight: 800;
            color: #f39c12;
            opacity: 0;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .combo-text.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="loading">
        <div class="spin"></div>
        <p>ARROWS MASTER</p>
    </div>
    <div id="hud">
        <div id="hearts-container">
            <div class="heart" id="heart-0"></div>
            <div class="heart" id="heart-1"></div>
            <div class="heart" id="heart-2"></div>
        </div>
        <div id="timer-container">
            <div id="timer-label">TIME</div>
            <div id="timer-text">01:00</div>
        </div>
        <div id="arrows-left-holder">
            <div id="arrows-left-label">ARROWS</div>
            <div id="arrows-left-text">–</div>
        </div>
    </div>
    <div id="streak-bar">
        <div id="streak-fill"></div>
    </div>
    <div id="feedback-container">
        <div id="vibe-text" class="feedback-text">EXCELLENT</div>
        <div id="combo-text" class="combo-text">Combo 2</div>
    </div>
    <div id="canvas-wrap"><canvas id="gameCanvas"></canvas></div>
    <div class="overlay-screen" id="failure-screen">
        <h1 id="fail-title">Out of Lives!</h1>
        <p id="fail-subtitle">Tap Restart to try again</p><button class="btn btn-primary" onclick="restartLevel()">↩
            Restart</button>
    </div>
    <div class="overlay-screen" id="win-screen">
        <h1 id="win-text">Amazing!</h1>
        <p>You cleared all arrows!</p><button class="btn btn-primary" onclick="restartLevel()">▶ Play Again</button>
    </div>
    <div id="wrong-flash"></div>

                        const localT = Math.min(1, Math.max(0, (propagationT - segDelay) * 3.0));
                        const nudge = cellSize * camera.zoom * 0.45 * Math.sin(localT * Math.PI);
                        return { x: p.x + this.lookDir[0] * nudge, y: p.y - this.lookDir[1] * nudge };
                    });
                }
                return base;
            }

            startSuccessAnim() {
                this.lastAnimTarget = this.color;
                // Start fade from green to black immediately
                this.colorAnim = { from: '#27ae60', to: this.color, t: 0, dur: 0.35, next: null };
            }
            startBounceAnim() {
                this.bounceT = 0;
                this.bounceDur = 0.3; // Longer for more visibility
            }
            startBlockedAnim() {
                this.lastAnimTarget = this.color; // Back to black after flash
                this.colorAnim = { from: '#27ae60', to: '#e74c3c', t: 0, dur: 0.08, next: this.color };
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        //  INPUT
        // ═══════════════════════════════════════════════════════════════════
        let pressTimer = null, pressTargetArrow = null, isPanning = false, lastPanPos = { x: 0, y: 0 }, panAccum = 0;
        canvas.addEventListener('pointerdown', e => {
            if (!canInteract) return; e.preventDefault();
            const rect = canvas.getBoundingClientRect(), sx = (e.clientX - rect.left) * (canvas.width / rect.width), sy = (e.clientY - rect.top) * (canvas.height / rect.height);
            lastPanPos = { x: e.clientX, y: e.clientY }; isPanning = true; panAccum = 0;
            let bestArrow = null, bestDist = cellSize * 0.9 * camera.zoom;
            arrowList.forEach(a => { if (a.gone) return; a.getVisualPositions().forEach(pos => { const d = Math.hypot(pos.x - sx, pos.y - sy); if (d < bestDist) { bestDist = d; bestArrow = a; } }); });
            if (bestArrow) {
                pressTargetArrow = bestArrow;
                pressTargetArrow.drawColor = '#27ae60'; // Highlight Green
                pressTimer = setTimeout(() => { if (pressTargetArrow) pressTargetArrow.isShowingHint = true; pressTimer = null; }, 500);
            }
        });
        canvas.addEventListener('pointermove', e => {
            if (!isPanning) return;
            const dx = (e.clientX - lastPanPos.x) / camera.zoom, dy = (e.clientY - lastPanPos.y) / camera.zoom;
            camera.x -= dx; camera.y += dy; targetCam.x = camera.x; targetCam.y = camera.y;
            lastPanPos = { x: e.clientX, y: e.clientY }; panAccum += Math.hypot(dx, dy);
            if (panAccum > 5) {
                if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
                if (pressTargetArrow) {
                    pressTargetArrow.drawColor = pressTargetArrow.color; // Reset color
                    pressTargetArrow.isShowingHint = false;
                    pressTargetArrow = null;
                }
            }
        });
        canvas.addEventListener('pointerup', e => {
            isPanning = false; if (!pressTargetArrow) return;
            if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; onArrowClicked(pressTargetArrow); }
            else { pressTargetArrow.isShowingHint = false; }
            pressTargetArrow = null;
        });
        canvas.addEventListener('wheel', e => { e.preventDefault(); targetCam.zoom = Math.min(Math.max(targetCam.zoom * Math.pow(0.999, e.deltaY), 0.1), 3.0); });

        // ═══════════════════════════════════════════════════════════════════
        //  LEVEL ENGINE
        // ═══════════════════════════════════════════════════════════════════
        async function loadLevel() {
            try {
                for (let k in occupancy) delete occupancy[k];
                gridSize = LEVEL_DATA.gridSize;
                arrowList = LEVEL_DATA.arrows.map(d => new Arrow(d));
                activeArrowsCount = arrowList.length; lives = 3;

                currentTime = LEVEL_DATA.duration || 0;
                isTimerActive = currentTime > 0;
                isWinning = false; isEntranceFinished = false;

                if (timerInterval) clearInterval(timerInterval);
                document.getElementById('timer-container').classList.toggle('visible', isTimerActive);
                updateTimerDisplay();

                document.getElementById('failure-screen').classList.remove('visible');
                document.getElementById('win-screen').classList.remove('visible');

                SFX.playLevelInit();

                // 1. Determine level framing
                recalcLayout();
                const gameplayZoom = targetCam.zoom;

                updateLivesUI(); updateArrowsLeftUI(activeArrowsCount);

                // 2. Set initial camera for build phase
                camera.x = targetCam.x; camera.y = targetCam.y;
                camera.zoom = gameplayZoom * 0.6;
                targetCam.zoom = camera.zoom; // Hold zoom during build

                document.getElementById('canvas-wrap').classList.add('ready');

                await entranceAnim();

                // 3. Glide zoom into gameplay framing
                targetCam.zoom = gameplayZoom;
                isEntranceFinished = true; canInteract = true;
                if (isTimerActive) timerInterval = setInterval(tickTimer, 100);
            } catch (e) { console.error("Load failed:", e); }
        }

        async function entranceAnim() {
            return new Promise(resolve => {
                let start = Date.now();
                const totalDur = 1600; // 1.6s for full growth
                arrowList.forEach(a => { a.isGrowing = true; a.growthT = 0; a.segments = []; });
                function tick() {
                    let elapsed = Date.now() - start;
                    let t = Math.min(1, elapsed / totalDur);
                    arrowList.forEach(a => { a.growthT = t; });
                    if (t < 1) requestAnimationFrame(tick);
                    else {
                        arrowList.forEach(a => {
                            a.isGrowing = false;
                            a.growthT = 1;
                            a.segments = [...a.pathData];
                            a.segments.forEach(s => registerOcc(s.x, s.y, a.id));
                        });
                        resolve();
                    }
                }
                requestAnimationFrame(tick);
            });
        }

        function recalcLayout() {
            let minX = 100, maxX = 0, minY = 100, maxY = 0;
            arrowList.forEach(a => a.pathData.forEach(p => { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }));
            const w = (maxX - minX + 1) * cellSize, h = (maxY - minY + 1) * cellSize;
            targetCam.zoom = Math.min((canvas.width - 60) / w, (canvas.height - 60) / h, 1.5);
            targetCam.x = (minX + maxX + 1) * 0.5 * cellSize; targetCam.y = (minY + maxY + 1) * 0.5 * cellSize;
        }

        function gridToScreen(gx, gy) {
            return { x: canvas.width * 0.5 + (gx * cellSize + cellSize * 0.5 - camera.x) * camera.zoom, y: canvas.height * 0.5 - (gy * cellSize + cellSize * 0.5 - camera.y) * camera.zoom };
        }

        function showVibe() {
            const vibes = [
                { t: 'GOOD!', s: 'good' },
                { t: 'NICE!', s: 'nice' },
                { t: 'PERFECT!', s: 'perfect' },
                { t: 'EXCELLENT!', s: 'excellent' },
                { t: 'AMAZING!', s: 'amazing' }
            ];
            const v = vibes[Math.floor(Math.random() * vibes.length)];
            const el = document.getElementById('vibe-text');
            el.textContent = v.t;
            SFX.playVibe(v.s);
            el.classList.remove('show', 'punch');
            void el.offsetWidth;
            el.classList.add('show', 'punch');
            if (vibeTimer) clearTimeout(vibeTimer);
            vibeTimer = setTimeout(() => el.classList.remove('show'), 1200);
        }

        function showComboFeedback(n) {
            const el = document.getElementById('combo-text');
            el.textContent = `Combo ${n}`;
            const qs = [
                { t: '25%', l: '30%' },
                { t: '25%', l: '70%' },
                { t: '70%', l: '30%' },
                { t: '70%', l: '70%' }
            ];
            const q = qs[Math.floor(Math.random() * qs.length)];
            el.style.top = q.t; el.style.left = q.l;
            el.classList.remove('show', 'punch');
            void el.offsetWidth;
            el.classList.add('show', 'punch');
            if (comboTimer) clearTimeout(comboTimer);
            comboTimer = setTimeout(() => el.classList.remove('show'), 800);
        }

        function onArrowClicked(a) {
            if (a.isMoving || a.gone) return;
            if (a.canMoveForward()) {
                a.isMoving = true;
                SFX.playArrowSelect();
                a.startSuccessAnim();

                // Combo Logic
                const now = Date.now();
                if (now - lastSuccessTime < 1000) {
                    comboCount++;
                } else {
                    comboCount = 1;
                }
                lastSuccessTime = now;

                if (comboCount > 1) {
                    SFX.playStreak(comboCount - 1);
                    showComboFeedback(comboCount);
                }

                // Vibe Logic (mod 4 like Unity's specific checks)
                if (comboCount > 0 && comboCount % 4 === 0) {
                    showVibe();
                }

                // Like Logic (12% chance like Unity)
                if (Math.random() < 0.12) {
                    SFX.playLike();
                }

                activeArrowsCount--; updateArrowsLeftUI(activeArrowsCount);
                if (activeArrowsCount <= 0) setTimeout(() => {
                    isWinning = true;
                    isTimerActive = false;
                    canInteract = false;
                    SFX.playWin();
                    document.getElementById('win-screen').classList.add('visible');
                }, 400);
                (function step() { if (a.gone) return; if (!a.tryStep()) { a.isMoving = false; return; } setTimeout(step, 27); })();
            } else {
                SFX.playMistake();
                flashWrong();
                a.startBlockedAnim();
                a.startBounceAnim();

                if (!a.hasReducedLife) {
                    a.hasReducedLife = true;
                    lives--;
                    updateLivesUI();
                    if (lives <= 0) handleGameOver(false);
                }

                // Reset combo on mistake
                comboCount = 0;
            }
        }

        function handleGameOver(tu) { canInteract = false; isTimerActive = false; document.getElementById('fail-title').textContent = tu ? "Time's Up!" : "Out of Lives!"; document.getElementById('failure-screen').classList.add('visible'); }
        function tickTimer() { currentTime -= 0.1; if (currentTime <= 0) { currentTime = 0; handleGameOver(true); } updateTimerDisplay(); }
        function updateTimerDisplay() { const s = Math.ceil(currentTime), m = String(Math.floor(s / 60)).padStart(2, '0'), sec = String(s % 60).padStart(2, '0'); document.getElementById('timer-text').textContent = `${m}:${sec}`; }
        function updateLivesUI() { for (let i = 0; i < 3; i++) document.getElementById(`heart-${i}`).classList.toggle('inactive', i >= lives); }
        function updateArrowsLeftUI(n) { const el = document.getElementById('arrows-left-text'); el.textContent = n; el.classList.remove('punch-simple'); void el.offsetWidth; el.classList.add('punch-simple'); }
        function flashWrong() { const el = document.getElementById('wrong-flash'); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 220); }
        function lerpColor(a, b, t) { const h2r = (h) => { let r = 0, g = 0, b = 0; if (h.length == 4) { r = parseInt(h[1] + h[1], 16); g = parseInt(h[2] + h[2], 16); b = parseInt(h[3] + h[3], 16); } else { r = parseInt(h.slice(1, 3), 16); g = parseInt(h.slice(3, 5), 16); b = parseInt(h.slice(5, 7), 16); } return { r, g, b }; }; const c1 = h2r(a), c2 = h2r(b); return `rgb(${Math.round(c1.r + (c2.r - c1.r) * t)},${Math.round(c1.g + (c2.g - c1.g) * t)},${Math.round(c1.b + (c2.b - c1.b) * t)})`; }
        function restartLevel() { location.reload(); }

        let lastTime = 0;
        function gameLoop(ts) {
            const dt = Math.min((ts - lastTime) / 1000, 0.1); lastTime = ts;
            camera.x += (targetCam.x - camera.x) * CAM_LERP;
            camera.y += (targetCam.y - camera.y) * CAM_LERP;
            camera.zoom += (targetCam.zoom - camera.zoom) * CAM_LERP;
            arrowList.forEach(a => a.update(dt));
            ctx2d.clearRect(0, 0, canvas.width, canvas.height);
            // Grid
            ctx2d.save(); ctx2d.fillStyle = 'rgba(0,0,0,0.06)';
            for (let gx = 0; gx < gridSize.x; gx++) { for (let gy = 0; gy < gridSize.y; gy++) { const pos = gridToScreen(gx, gy); ctx2d.beginPath(); ctx2d.arc(pos.x, pos.y, cellSize * camera.zoom * 0.1, 0, Math.PI * 2); ctx2d.fill(); } }
            ctx2d.restore();
            arrowList.forEach(a => a.draw(ctx2d));
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('resize', () => { canvas.width = document.getElementById('canvas-wrap').clientWidth; canvas.height = document.getElementById('canvas-wrap').clientHeight; recalcLayout(); });
        window.dispatchEvent(new Event('resize'));
        (async () => {
            const buildPromise = loadLevel();
            document.activeElement?.blur();
            document.getElementById('loading').classList.add('hidden');
            requestAnimationFrame(ts => { lastTime = ts; gameLoop(ts); });
            await buildPromise;
        })();
    </script>
</body>

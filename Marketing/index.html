            let bestMovable = null, bestMovableDist = Infinity;
            let bestAny = null, bestAnyDist = Infinity;
            for (let dy = -cellRadius; dy <= cellRadius; dy++) {
                for (let dx = -cellRadius; dx <= cellRadius; dx++) {
                    const gx = g.gx + dx, gy = g.gy + dy;
                    const occ = getOccupant(gx, gy);
                    if (occ === null) continue;
                    const a = arrowById.get(occ);
                    if (!a || a.gone || a.isMoving) continue;
                    // An arrow can occupy several cells in range; each cell is
                    // compared independently so the arrow's closest cell wins.
                    const cellCx = gx * cellSize + cellSize * 0.5;
                    const cellCy = gy * cellSize + cellSize * 0.5;
                    const dist = Math.hypot(worldX - cellCx, worldY - cellCy);
                    if (dist < bestAnyDist) { bestAnyDist = dist; bestAny = a; }
                    if (a.canMoveForward() && dist < bestMovableDist) { bestMovableDist = dist; bestMovable = a; }
                }
            }
            // Prefer a movable arrow within the forgiving radius; otherwise fall
            // back to the closest arrow at all (so tapping a blocked arrow still
            // shows its normal "can't move" feedback instead of silently missing).
            return bestMovable || bestAny;
        }

        function syncCanvasRect() {
            const r = canvas.getBoundingClientRect();
            canvasRect = { left: r.left, top: r.top, width: r.width || 1, height: r.height || 1 };
        }

        function resizeGameCanvas() {
            const wrap = document.getElementById('canvas-wrap');
            viewW = Math.max(1, wrap.clientWidth || 400);
            viewH = Math.max(1, wrap.clientHeight || 600);
            const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
            const bw = Math.max(1, Math.floor(viewW * dpr));
            const bh = Math.max(1, Math.floor(viewH * dpr));
            if (canvas.width !== bw || canvas.height !== bh) {
                canvas.width = bw;
                canvas.height = bh;
            }
            canvas.style.width = viewW + 'px';
            canvas.style.height = viewH + 'px';
            currentDpr = dpr;
            ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx2d.imageSmoothingEnabled = true;
            syncCanvasRect();
            gridTexKey = '';
            invalidateStaticLayer();
        }

        function ensureHeadTints() {
            if (!headImg.complete || headImg.naturalWidth <= 0) return;
            if (headTintCache.size >= HEAD_CACHE_COLORS.length) return;
            const s = 64;
            for (const col of HEAD_CACHE_COLORS) {
                if (headTintCache.has(col)) continue;
                const c = document.createElement('canvas');
                c.width = c.height = s;
                const x = c.getContext('2d');
                x.drawImage(headImg, 0, 0, s, s);
                x.globalCompositeOperation = 'source-atop';
                x.fillStyle = col;
                x.fillRect(0, 0, s, s);
                headTintCache.set(col, c);
            }
        }
        // If the board was baked before Head.png finished loading, idle arrows
        // kept the geometric-triangle fallback forever. Rebake once the sprite is ready.
        headImg.onload = () => {
            ensureHeadTints();
            for (let i = 0; i < arrowList.length; i++) {
                arrowList[i]._tintCol = null;
                arrowList[i]._tintImg = null;
            }
            invalidateStaticLayer();
            sceneDirty = true;
        };
        if (headImg.complete && headImg.naturalWidth > 0) ensureHeadTints();

        // Exact body-matching head tint (same PNG, source-atop once into cache — never approx color).
        function headTintForColor(col) {
            if (!col) col = '#000000';
            ensureHeadTints();
            if (headTintCache.has(col)) return headTintCache.get(col);
            if (!headImg.complete || headImg.naturalWidth <= 0) return null;
            const s = 64;
            const c = document.createElement('canvas');
            c.width = c.height = s;
            const x = c.getContext('2d');
            x.drawImage(headImg, 0, 0, s, s);
            x.globalCompositeOperation = 'source-atop';
            x.fillStyle = col;
            x.fillRect(0, 0, s, s);
            headTintCache.set(col, c);
            return c;
        }

        function ensureGridTexture() {
            const key = gridSize.x + 'x' + gridSize.y + ':' + cellSize;
            if (gridTex && gridTexKey === key) return gridTex;
            gridTexKey = key;
            const w = Math.max(1, gridSize.x * cellSize);
            const h = Math.max(1, gridSize.y * cellSize);
            gridTex = document.createElement('canvas');
            gridTex.width = w;
            gridTex.height = h;
            const g = gridTex.getContext('2d');
            g.fillStyle = 'rgba(0,0,0,0.06)';
            const rad = cellSize * 0.1;
            // Fewer dots on coarse pointers (still readable, far cheaper).
            const step = IS_COARSE ? 2 : 1;
            for (let gx = 0; gx < gridSize.x; gx += step) {
                for (let gy = 0; gy < gridSize.y; gy += step) {
                    g.beginPath();
                    g.arc(gx * cellSize + cellSize * 0.5, gy * cellSize + cellSize * 0.5, rad, 0, Math.PI * 2);
                    g.fill();
                }
            }
            return gridTex;
        }

        // ── World-space board bake ─────────────────────────────────────────
        // Grid + idle arrows are rendered ONCE into an offscreen texture in
        // world pixels. Camera pan / pinch / glide never re-render arrows;
        // every frame is just one transformed drawImage of the same bitmap.
        // The bake is refreshed only when an arrow actually changes state.
        let boardTex = null, boardTexValid = false, boardBakeScale = 1;
        let currentDpr = 1;
        // 15% faster than the Unity fast-step threshold, per user request.
        const SPEED_UP = 1.15;
        const MOVE_STEP_DUR = ((IS_COARSE || IS_LOW_END) ? 0.05 : 0.032) / SPEED_UP;
        const BLOCK_STEP_DUR = ((IS_COARSE || IS_LOW_END) ? 0.05 : 0.032) / SPEED_UP;
        const IMPACT_PAUSE_S = 0.14;

        function invalidateStaticLayer() { boardTexValid = false; }

        const BAKE_SCALE_MIN = 0.4, BAKE_SCALE_MAX = 1.5;
        function desiredBakeScale() {
            // A little headroom over the current zoom keeps idle arrows crisp
            // after small zoom-ins without forcing a rebake.
            return Math.min(BAKE_SCALE_MAX, Math.max(BAKE_SCALE_MIN, camera.zoom * 1.25));
        }

        function isArrowDynamic(a) {
            if (!a || a.gone) return false;
            if (a.isMoving || a.isGrowing || a.isShowingHint) return true;
            if (a.moveT != null && a.moveT < 1) return true;
            if (a.bounceT < 1) return true;
            if (a.colorAnim) return true;
            if (a.drawColor !== a.color) return true; // press highlight
            if (a._animQueue) return true;
            return false;
        }

        function cameraSettled() {
            return Math.abs(camera.x - targetCam.x) <= 0.02
                && Math.abs(camera.y - targetCam.y) <= 0.02
                && Math.abs(camera.zoom - targetCam.zoom) <= 0.0005;
        }

        function rebuildBoardTex() {
            const worldW = Math.max(1, gridSize.x * cellSize);
            const worldH = Math.max(1, gridSize.y * cellSize);
            const k = desiredBakeScale();
            boardBakeScale = k;
            const w = Math.max(1, Math.round(worldW * k));
            const h = Math.max(1, Math.round(worldH * k));
            if (!boardTex) boardTex = document.createElement('canvas');
            if (boardTex.width !== w || boardTex.height !== h) { boardTex.width = w; boardTex.height = h; }
            const b = boardTex.getContext('2d');
            b.setTransform(1, 0, 0, 1, 0, 0);
            b.clearRect(0, 0, w, h);
            b.imageSmoothingEnabled = true;
            // Grid dots, flipped so texture rows match world Y-up.
            b.save();
            b.translate(0, h);
            b.scale(k, -k);
            b.drawImage(ensureGridTexture(), 0, 0);
            b.restore();
            // Aim the shared camera at the texture so Arrow.draw() lands in
            // world pixels: screenX = k*worldX, screenY = k*(worldH - worldY).
            const cx = camera.x, cy = camera.y, cz = camera.zoom;
            camera.zoom = k;
            camera.x = (viewW * 0.5) / k;
            camera.y = worldH - (viewH * 0.5) / k;
            for (let i = 0; i < arrowList.length; i++) {
                const a = arrowList[i];
                if (a.gone || isArrowDynamic(a)) continue;
                a.draw(b);
            }
            camera.x = cx; camera.y = cy; camera.zoom = cz;
            boardTexValid = true;
        }

        class Arrow {
            constructor(d) {
                this.id = d.id;
                this.pathData = d.path.map(p => ({ x: p.x, y: p.y }));
                this.lookDir = DIR_MAP[d.lookDirection.toLowerCase()] || [0, 1];
                this.color = '#000000'; // All arrows solid black
                this.segments = []; // Current spawned segments on grid
                this.isMoving = false;
                this.gone = false;
                this.hasReducedLife = false; // Each arrow can reduce life only once
                this.bounceT = 1.0;
                this.bounceDur = 0.22;
                this.growthT = 1.0;
                this.isGrowing = false;
                this.drawColor = this.color;
                this.isShowingHint = false;
            }

            get head() { return this.segments[this.segments.length - 1]; }

            // Follow last segment direction for head rotation (reused array — no per-frame alloc)
            get visualDirection() {
                if (!this._vDir) this._vDir = [0, 0];
                const out = this._vDir;
                const count = this.segments.length;
                if (count >= 2) {
                    const h = this.segments[count - 1], p = this.segments[count - 2];
                    const dx = h.x - p.x, dy = h.y - p.y;
                    if (dx !== 0 || dy !== 0) {
                        out[0] = dx * (Math.abs(dx) > Math.abs(dy) ? 1 : 0);
                        out[1] = dy * (Math.abs(dy) > Math.abs(dx) ? 1 : 0);
                        return out;
                    }
                } else if (this.isGrowing && this.pathData.length >= 2) {
                    const h = this.pathData[1], p = this.pathData[0];
                    out[0] = h.x - p.x; out[1] = h.y - p.y;
                    return out;
                }
                out[0] = this.lookDir[0]; out[1] = this.lookDir[1];
                return out;
            }

            canMoveForward() {
                if (!this.segments.length) return false;
                // O(1) path from ArrowDependencyTree when available
                if (depTree.isFree(this)) return true;
                // Fallback: GridManager.IsArrowFreeByForwardRay
                const h = this.head;
                let cx = h.x + this.lookDir[0], cy = h.y + this.lookDir[1];
                while (!isOOB(cx, cy)) {
                    const occ = getOccupant(cx, cy);
                    if (occ !== null && occ !== this.id) {
                        const other = arrowById.get(occ);
                        if (other && !other.isMoving && !other.gone) return false;
                    }
                    cx += this.lookDir[0]; cy += this.lookDir[1];
                }
                return true;
            }

            tryStep() {
                const nx = this.head.x + this.lookDir[0], ny = this.head.y + this.lookDir[1];
                if (!this.escaping && !this.canMoveForward()) return false;

                const tail = this.segments[0];
                if (!isOOB(tail.x, tail.y)) releaseOcc(tail.x, tail.y);

                const n = this.segments.length;
                if (!this.moveSources || this.moveSources.length < n) {
                    this.moveSources = new Array(n);
                    this.moveTargets = new Array(n);
                    for (let i = 0; i < n; i++) {
                        this.moveSources[i] = { x: 0, y: 0 };
                        this.moveTargets[i] = { x: 0, y: 0 };
                    }
                }
                for (let i = 0; i < n; i++) gridToScreenInto(this.segments[i].x, this.segments[i].y, this.moveSources[i]);

                for (let i = 0; i < n - 1; i++) {
                    this.segments[i].x = this.segments[i + 1].x;
                    this.segments[i].y = this.segments[i + 1].y;
                }
                this.segments[n - 1].x = nx;
                this.segments[n - 1].y = ny;

                if (!isOOB(nx, ny)) registerOcc(nx, ny, this.id);
                else this.escaping = true;

                let allOob = true;
                for (let i = 0; i < n; i++) {
                    if (!isOOB(this.segments[i].x, this.segments[i].y)) { allOob = false; break; }
                }
                if (allOob) { this.gone = true; invalidateStaticLayer(); return true; }
                for (let i = 0; i < n; i++) gridToScreenInto(this.segments[i].x, this.segments[i].y, this.moveTargets[i]);
                this.moveSources.length = n;
                this.moveTargets.length = n;
                this.moveT = 0;
                return true;
            }

            update(dt) {
                if (this.gone) return;
                const stepDur = this._animQueue ? BLOCK_STEP_DUR : MOVE_STEP_DUR;
                if (this.moveT != null && this.moveT < 1) {
                    this.moveT = Math.min(1, this.moveT + dt / stepDur);
                }
                if (this.bounceT < 1) this.bounceT = Math.min(1, this.bounceT + dt / this.bounceDur);

                if (this.colorAnim) {
                    this.colorAnim.t = Math.min(1, this.colorAnim.t + dt / this.colorAnim.dur);
                    // Discrete tint (no per-frame rgb string) — still reads as a flash
                    this.drawColor = this.colorAnim.t < 0.55 ? this.colorAnim.from : this.colorAnim.to;
                    if (this.colorAnim.t >= 1) {
                        if (this.colorAnim.next) this.colorAnim = { from: this.colorAnim.to, to: this.colorAnim.next, t: 0, dur: this.colorAnim.dur, next: null };
                        else {
                            this.colorAnim = null;
                            this.drawColor = this.lastAnimTarget || this.color;
                        }
                    }
                }

                // RAF-driven step chains (smooth 60fps, no setTimeout jitter)
                if (this._autoStep && (this.moveT == null || this.moveT >= 1)) {
                    if (this.gone) { this._autoStep = false; this.isMoving = false; invalidateStaticLayer(); }
                    else if (!this.tryStep()) {
                        this._autoStep = false;
                        this.isMoving = false;
                        invalidateStaticLayer();
                    }
                }

                if (this._animQueue) this._advanceAnimQueue(dt);
            }

            _advanceAnimQueue(dt) {
                const q = this._animQueue;
                if (!q) return;
                if (q.phase === 'impact') {
                    q.impactWait -= dt;
                    if (q.impactWait <= 0) {
                        this.bounceT = 1;
                        q.phase = 'reverse';
                        if (q.idx > 0) {
                            q.idx--;
                            this.animateSegmentsTo(q.history[q.idx]);
                        } else {
                            this._finishAnimQueue();
                        }
                    }
                    return;
                }
                if (this.moveT != null && this.moveT < 1) return;
                if (q.phase === 'forward') {
                    if (q.idx < q.history.length - 1) {
                        q.idx++;
                        this.animateSegmentsTo(q.history[q.idx]);
                    } else {
                        q.phase = 'impact';
                        q.impactWait = IMPACT_PAUSE_S;
                        SFX.playMistake();
                        flashWrong();
                        this.startBlockedAnim();
                        this.startBounceAnim();
                    }
                } else if (q.phase === 'reverse') {
                    if (q.idx > 0) {
                        q.idx--;
                        this.animateSegmentsTo(q.history[q.idx]);
                    } else {
                        this._finishAnimQueue();
                    }
                }
            }

            _finishAnimQueue() {
                const q = this._animQueue;
                this._animQueue = null;
                invalidateStaticLayer();
                if (q && q.resolve) q.resolve();
            }

            // Port of ArrowController.UpdateLinePositions — keep stroke on grid (corner inject on turns).
            _linePt(i) {
                if (!this._lineBuf) this._lineBuf = [];
                let p = this._lineBuf[i];
                if (!p) { p = { x: 0, y: 0 }; this._lineBuf[i] = p; }
                return p;
            }
            // No inner closures here — a per-frame closure per moving arrow was a real GC source on mobile.
            _pushLinePt(len, x, y, snap2) {
                if (len > 0) {
                    const prev = this._linePt(len - 1);
                    const dx = prev.x - x, dy = prev.y - y;
                    if (dx * dx + dy * dy <= snap2) return len;
                }
                const p = this._linePt(len);
                p.x = x; p.y = y;
                return len + 1;
            }
            buildGridAlignedStroke(segs) {
                const out = this._lineBuf || (this._lineBuf = []);
                let len = 0;
                const n = segs.length;
                if (n === 0) { out.length = 0; return out; }
                const snap = Math.max(0.35, cellSize * camera.zoom * 0.02);
                const snap2 = snap * snap;
                if (!this._tmpA) { this._tmpA = { x: 0, y: 0 }; this._tmpB = { x: 0, y: 0 }; }

                if (n === 1) {
                    len = this._pushLinePt(len, segs[0].x, segs[0].y, snap2);
                    out.length = len;
                    return out;
                }

                const hasGrid = this.segments && this.segments.length === n && !this.isGrowing;
                // Cache each segment's snapped grid screen pos once (was recomputed twice per pair before).
                let prevSnapX = 0, prevSnapY = 0, havePrevSnap = false;

                for (let i = 0; i < n - 1; i++) {
                    let p1x = segs[i].x, p1y = segs[i].y;
                    let p2x = segs[i + 1].x, p2y = segs[i + 1].y;
                    let g1x = 0, g1y = 0, g2x = 0, g2y = 0;

                    if (hasGrid) {
                        if (havePrevSnap) {
                            g1x = prevSnapX; g1y = prevSnapY;
                        } else {
                            gridToScreenInto(this.segments[i].x, this.segments[i].y, this._tmpA);
                            g1x = this._tmpA.x; g1y = this._tmpA.y;
                        }
                        if ((p1x - g1x) * (p1x - g1x) + (p1y - g1y) * (p1y - g1y) < snap2) {
                            p1x = g1x; p1y = g1y;
                        }
                        gridToScreenInto(this.segments[i + 1].x, this.segments[i + 1].y, this._tmpB);
                        g2x = this._tmpB.x; g2y = this._tmpB.y;
                        if ((p2x - g2x) * (p2x - g2x) + (p2y - g2y) * (p2y - g2y) < snap2) {
                            p2x = g2x; p2y = g2y;
                        }
                        prevSnapX = g2x; prevSnapY = g2y; havePrevSnap = true;
                    }

                    len = this._pushLinePt(len, p1x, p1y, snap2);

                    // Inject elbow if chord is diagonal (Unity turn-corner fix)
                    if (Math.abs(p1x - p2x) > snap && Math.abs(p1y - p2y) > snap) {
                        let cx, cy;
                        if (hasGrid) {
                            const s1 = Math.abs(p1x - g1x) + Math.abs(p1y - g1y)
                                + Math.abs(p2x - g1x) + Math.abs(p2y - g1y);
                            const s2 = Math.abs(p1x - g2x) + Math.abs(p1y - g2y)
                                + Math.abs(p2x - g2x) + Math.abs(p2y - g2y);
                            if (s1 <= s2) { cx = g1x; cy = g1y; }
                            else { cx = g2x; cy = g2y; }
                        } else {
                            const e1x = p1x, e1y = p2y, e2x = p2x, e2y = p1y;
                            const s1 = Math.abs(p1y - e1y) + Math.abs(p2x - e1x);
                            const s2 = Math.abs(p1x - e2x) + Math.abs(p2y - e2y);
                            if (s1 <= s2) { cx = e1x; cy = e1y; }
                            else { cx = e2x; cy = e2y; }
                        }
                        len = this._pushLinePt(len, cx, cy, snap2);
                    }
                }

                len = this._pushLinePt(len, segs[n - 1].x, segs[n - 1].y, snap2);
                out.length = len;
                return out;
            }

            draw(ctx) {
                if (this.gone) return;
                const segs = this.getVisualPositions();
                if (!segs || !segs.length) return;

                const col = this.drawColor, cs = cellSize * camera.zoom;
                const n = segs.length;
                const stroke = this.buildGridAlignedStroke(segs);

                // Head.png: tip at top, triangle base ~y=33/40, shaft stub ~y=36-39
                // with shaft width 14/40 of the sprite. Size the head so that stub
                // exactly matches the body stroke — eliminates the shoulder "pick".
                const lineW = cs * 0.21;
                const HEAD_SHAFT_FRAC = 14 / 40;
                const hs = lineW / HEAD_SHAFT_FRAC;
                const vDir = this.visualDirection;
                const vLen = Math.hypot(vDir[0], vDir[1]) || 1;
                // Screen look: grid Y is up, canvas Y is down.
                const lookX = vDir[0] / vLen;
                const lookY = -vDir[1] / vLen;

                // Unity UpdateLinePositions: pull the stroke end back under the head
                // so the body doesn't poke past the triangle base.
                // Shaft junction sits ~0.39 of the sprite behind center.
                if (stroke.length > 1) {
                    const tuck = hs * ((35.5 - 20) / 40);
                    const last = stroke[stroke.length - 1];
                    last.x -= lookX * tuck;
                    last.y -= lookY * tuck;
                }

                if (stroke.length > 1) {
                    ctx.strokeStyle = col;
                    ctx.lineWidth = lineW;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(stroke[0].x, stroke[0].y);
                    for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
                    ctx.stroke();
                }

                // Soft segment dots: desktop/hi-end only
                if (!IS_COARSE && !IS_LOW_END) {
                    ctx.fillStyle = 'rgba(0,0,0,0.06)';
                    const rad = cs * 0.34;
                    for (let i = 0; i < n; i++) {
                        ctx.beginPath();
                        ctx.arc(segs[i].x, segs[i].y, rad, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (!this.isMoving && this.isShowingHint && this.canMoveForward()) {
                    const h = segs[n - 1];
                    const end = gridToScreen(this.segments[this.segments.length - 1].x + this.lookDir[0] * 60, this.segments[this.segments.length - 1].y + this.lookDir[1] * 60);
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
                    ctx.lineWidth = cs * 0.09;
                    ctx.setLineDash([cs * 0.12, cs * 0.16]);
                    ctx.beginPath();
                    ctx.moveTo(h.x, h.y);
                    ctx.lineTo(end.x, end.y);
                    ctx.stroke();
                    ctx.restore();
                }

                // Head PNG only (never the geometric triangle fallback — that was
                // the "sometimes wrong sprite" bug while Head.png was still loading
                // or when a stale bake captured it).
                const hPos = segs[n - 1], angle = Math.atan2(vDir[0], vDir[1]);
                let tinted = this._tintImg;
                if (this._tintCol !== col) {
                    this._tintCol = col;
                    this._tintImg = tinted = headTintForColor(col);
                }
                if (!tinted) return;
                ctx.save();
                ctx.translate(hPos.x, hPos.y);
                ctx.rotate(angle);
                ctx.drawImage(tinted, -hs * 0.5, -hs * 0.5, hs, hs);
                ctx.restore();
            }

            _visPoint(i) {
                if (!this._vis) this._vis = [];
                let p = this._vis[i];
                if (!p) { p = { x: 0, y: 0 }; this._vis[i] = p; }
                return p;
            }

            getVisualPositions() {
                if (!this._vis) this._vis = [];
                const out = this._vis;

                if (this.isGrowing && this.growthT < 1) {
                    const total = this.pathData.length;
                    const progress = this.growthT * total;
                    const count = Math.ceil(progress);
                    out.length = count;
                    if (count === 0) return out;
                    for (let i = 0; i < count; i++) {
                        const p = this.pathData[i];
                        gridToScreenInto(p.x, p.y, this._visPoint(i));
                    }
                    if (count > 1) {
                        const last = out[count - 1], prev = out[count - 2];
                        const partial = progress % 1 || 1;
                        const dest = this._visPoint(count - 1);
                        dest.x = prev.x + (last.x - prev.x) * partial;
                        dest.y = prev.y + (last.y - prev.y) * partial;
                    }
                    return out;
                }

                const n = this.segments.length;
                out.length = n;
                for (let i = 0; i < n; i++) {
                    const s = this.segments[i];
                    gridToScreenInto(s.x, s.y, this._visPoint(i));
                }
                if (this.moveT != null && this.moveT < 1 && this.moveSources && this.moveTargets) {
                    const t = 1 - Math.pow(1 - this.moveT, 2.5);
                    const m = this.moveSources.length;
                    out.length = m;
                    for (let i = 0; i < m; i++) {
                        const src = this.moveSources[i];
                        const tgt = this.moveTargets[i];
                        const dest = this._visPoint(i);
                        if (tgt) {
                            dest.x = src.x + (tgt.x - src.x) * t;
                            dest.y = src.y + (tgt.y - src.y) * t;
                        } else {
                            dest.x = src.x; dest.y = src.y;
                        }
                    }
                    return out;
                }
                if (this.bounceT < 1) {
                    // Impact bump only along look axis on the head — keeps body on grid lines
                    // (full-body wave was causing diagonal chord shake).
                    const localT = Math.min(1, Math.max(0, this.bounceT * 3.0));
                    const nudge = cellSize * camera.zoom * 0.35 * Math.sin(localT * Math.PI);
                    const head = out[n - 1];
                    head.x += this.lookDir[0] * nudge;
                    head.y -= this.lookDir[1] * nudge;
                    return out;
                }
                return out;
            }

            startSuccessAnim() {
                this.lastAnimTarget = this.color;
                // Start fade from green to black immediately
                this.colorAnim = { from: '#27ae60', to: this.color, t: 0, dur: 0.17, next: null };
            }
            startBounceAnim() {
                this.bounceT = 0;
                this.bounceDur = 0.16;
            }
            // Fired at the moment of impact so the red flash is actually visible
            // (previously the color was snapped to red before this ran, making the "animation" a no-op).
            startBlockedAnim() {
                this.lastAnimTarget = this.color;
                this.colorAnim = { from: this.drawColor || this.color, to: this.color, t: 0, dur: 0.16, next: null };
            }

            markAsMistake() {
                this.color = '#e74c3c';
                this.lastAnimTarget = '#e74c3c';
            }

            // Only checks the immediate next cell (unlike canMoveForward, which scans the whole path ahead).
            isNextStepBlocked(fromSeg) {
                const nx = fromSeg.x + this.lookDir[0], ny = fromSeg.y + this.lookDir[1];
                if (isOOB(nx, ny)) return true;
                const occ = getOccupant(nx, ny);
                return occ !== null && occ !== this.id;
            }

            // Simulates walking forward (without touching the real occupancy grid) until truly blocked,
            // returning every intermediate position so the animation can walk forward then retrace it exactly.
            simulateForwardHistory() {
                const history = [this.segments.map(s => ({ ...s }))];
                let sim = this.segments.map(s => ({ ...s }));
                const MAX_STEPS = 60;
                for (let i = 0; i < MAX_STEPS; i++) {
                    if (this.isNextStepBlocked(sim[sim.length - 1])) break;
                    const nx = sim[sim.length - 1].x + this.lookDir[0], ny = sim[sim.length - 1].y + this.lookDir[1];
                    for (let j = 0; j < sim.length - 1; j++) sim[j] = { ...sim[j + 1] };
                    sim[sim.length - 1] = { x: nx, y: ny };
                    history.push(sim.map(s => ({ ...s })));
                }
                return history;
            }

            // Tweens visually from the current on-screen position to a new grid snapshot.
            animateSegmentsTo(newSegs) {
                const vis = this.getVisualPositions();
                const n = newSegs.length;
                if (!this.moveSources || this.moveSources.length < n) {
                    this.moveSources = new Array(n);
                    this.moveTargets = new Array(n);
                    for (let i = 0; i < n; i++) {
                        this.moveSources[i] = { x: 0, y: 0 };
                        this.moveTargets[i] = { x: 0, y: 0 };
                    }
                }
                for (let i = 0; i < n; i++) {
                    const src = vis[i] || vis[vis.length - 1] || { x: 0, y: 0 };
                    this.moveSources[i].x = src.x;
                    this.moveSources[i].y = src.y;
                }
                if (!this.segments || this.segments.length !== n) {
                    this.segments = newSegs.map(s => ({ x: s.x, y: s.y }));
                } else {
                    for (let i = 0; i < n; i++) {
                        this.segments[i].x = newSegs[i].x;
                        this.segments[i].y = newSegs[i].y;
                    }
                }
                for (let i = 0; i < n; i++) gridToScreenInto(this.segments[i].x, this.segments[i].y, this.moveTargets[i]);
                this.moveSources.length = n;
                this.moveTargets.length = n;
                this.moveT = 0;
            }
        }

        // ═══════════════════════════════════════════════════════════════════
        //  INPUT
        // ═══════════════════════════════════════════════════════════════════
        let pressTimer = null, pressTargetArrow = null, isPanning = false, lastPanPos = { x: 0, y: 0 }, panAccum = 0;
        const activePointers = new Map(); // pointerId -> { x, y }
        let isPinching = false, lastPinchDist = 0;
        let gestureWasPinch = false;
        let pressStartClient = { x: 0, y: 0 };

        function clearPressTarget() {
            if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
            if (pressTargetArrow) {
                pressTargetArrow.drawColor = pressTargetArrow.color;
                pressTargetArrow.isShowingHint = false;
                pressTargetArrow = null;
                invalidateStaticLayer();
                sceneDirty = true;
            }
        }

        // Matches Unity ClickContainer: soft circle spreads to 2x and fades out.
        function spawnClickEffect(clientX, clientY) {
            const layer = document.getElementById('click-fx-layer');
            if (!layer) return;
            const wrap = document.createElement('div');
            wrap.className = 'click-fx';
            wrap.style.left = clientX + 'px';
            wrap.style.top = clientY + 'px';
            wrap.innerHTML = '<div class="click-fx-spread"></div><div class="click-fx-dot"></div>';
            layer.appendChild(wrap);
            setTimeout(() => wrap.remove(), 600);
        }

        function pinchDistance() {
            const pts = [...activePointers.values()];
            if (pts.length < 2) return 0;
            return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }

        function applyZoomFactor(factor) {
            targetCam.zoom = Math.min(Math.max(targetCam.zoom * factor, 0.1), 3.0);
            sceneDirty = true;
        }

        // Matches CameraController.HandleMobileZoom in Unity:
        // ortho += (prevDist - currDist) * (ortho / 500) * mobileZoomSpeed
        // with mobileZoomSpeed = 0.5 (ArrowsMasterGame.unity).
        // Our camera.zoom is the inverse of ortho size (larger = closer), so we divide.
        const MOBILE_ZOOM_SPEED = 0.5;
        const MOBILE_ZOOM_PIXEL_REF = 500;
        function applyPinchZoom(prevDist, currDist) {
            if (prevDist <= 0 || currDist <= 0) return;
            const dpr = window.devicePixelRatio || 1;
            const deltaMagnitudeDiff = (prevDist - currDist) * dpr;
            const factor = 1 + (deltaMagnitudeDiff / MOBILE_ZOOM_PIXEL_REF) * MOBILE_ZOOM_SPEED;
            if (factor <= 0.05) return;
            const next = Math.min(Math.max(camera.zoom / factor, 0.1), 3.0);
            // Apply immediately like Unity (no lerp lag on interaction zoom)
            camera.zoom = targetCam.zoom = next; sceneDirty = true;
        }

        canvas.addEventListener('pointerdown', e => {
            if (!canInteract) return; e.preventDefault();
            resetIdleHint();
            try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activePointers.size >= 2) {
                // Second finger: enter pinch mode, cancel any pending tap/pan select
                clearPressTarget();
                isPanning = false;
                isPinching = true;
                gestureWasPinch = true;
                lastPinchDist = pinchDistance();
                return;
            }

            isPinching = false;
            gestureWasPinch = false;
            pressStartClient = { x: e.clientX, y: e.clientY };
            const sx = (e.clientX - canvasRect.left) * (viewW / canvasRect.width), sy = (e.clientY - canvasRect.top) * (viewH / canvasRect.height);
            lastPanPos = { x: e.clientX, y: e.clientY }; isPanning = true; panAccum = 0;
            const bestArrow = pickArrowAtScreen(sx, sy);
            if (bestArrow) {
                pressTargetArrow = bestArrow;
                pressTargetArrow.drawColor = '#27ae60'; // Highlight Green
                invalidateStaticLayer();
                sceneDirty = true;
                pressTimer = setTimeout(() => { if (pressTargetArrow) { pressTargetArrow.isShowingHint = true; sceneDirty = true; } pressTimer = null; }, 500);
            }
        });
        canvas.addEventListener('pointermove', e => {
            if (!activePointers.has(e.pointerId)) return;
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (isPinching && activePointers.size >= 2) {
                const dist = pinchDistance();
                if (lastPinchDist > 0 && dist > 0) {
                    applyPinchZoom(lastPinchDist, dist);
                }
                lastPinchDist = dist;
                return;
            }

            if (!isPanning) return;
            const dx = (e.clientX - lastPanPos.x) / camera.zoom, dy = (e.clientY - lastPanPos.y) / camera.zoom;
            camera.x -= dx; camera.y += dy; targetCam.x = camera.x; targetCam.y = camera.y; sceneDirty = true;
            lastPanPos = { x: e.clientX, y: e.clientY }; panAccum += Math.hypot(dx, dy);
            if (panAccum > 5) clearPressTarget();
        });
        function endPointer(e) {
            if (!activePointers.has(e.pointerId)) return;
            activePointers.delete(e.pointerId);
            try { canvas.releasePointerCapture(e.pointerId); } catch (_) { }

            if (activePointers.size < 2) {
                isPinching = false;
                lastPinchDist = 0;
            }

            if (activePointers.size === 1) {
                // One finger left after pinch — resume pan from remaining finger, no accidental tap
                const rem = [...activePointers.values()][0];
                lastPanPos = { x: rem.x, y: rem.y };
                isPanning = true;
                panAccum = 999;
                clearPressTarget();
                return;
            }

            if (activePointers.size === 0) {
                isPanning = false;
                resetIdleHint();
                // Same as Unity InputManager: spawn click ripple on a short single-finger tap
                const moveThresh = Math.max(40, window.innerHeight * 0.03);
                const moved = Math.hypot(e.clientX - pressStartClient.x, e.clientY - pressStartClient.y);
                if (!SKIP_CLICK_FX && !gestureWasPinch && moved < moveThresh) {
                    spawnClickEffect(e.clientX, e.clientY);
                }
                gestureWasPinch = false;
                if (!pressTargetArrow) return;
                if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; onArrowClicked(pressTargetArrow); }
                else { pressTargetArrow.isShowingHint = false; }
                pressTargetArrow = null;
            }
        }
        canvas.addEventListener('pointerup', endPointer);
        canvas.addEventListener('pointercancel', endPointer);
        canvas.addEventListener('wheel', e => {
            e.preventDefault();
            applyZoomFactor(Math.pow(0.999, e.deltaY));
        }, { passive: false });

        // ═══════════════════════════════════════════════════════════════════
        //  LEVEL ENGINE
        // ═══════════════════════════════════════════════════════════════════
        async function loadLevel() {
            try {
                clearOccupancy();
                gridSize = LEVEL_DATA.gridSize;
                arrowList = LEVEL_DATA.arrows.map(d => new Arrow(d));
                arrowById = new Map(arrowList.map(a => [a.id, a]));
                activeArrowsCount = arrowList.length; lives = 3;

                currentTime = LEVEL_DATA.duration || 0;
                isTimerActive = currentTime > 0;
                isWinning = false; isEntranceFinished = false;

                if (timerInterval) clearInterval(timerInterval);
                document.getElementById('timer-container').classList.toggle('visible', isTimerActive);
                updateTimerDisplay();

                document.getElementById('end-screen').classList.remove('visible');
                document.getElementById('time-up-msg').classList.remove('visible');
                document.getElementById('time-up-msg').setAttribute('aria-hidden', 'true');
                stopEndTypewriter();
                document.getElementById('end-typewriter').textContent = '';
                document.getElementById('end-typewriter').classList.remove('done');
                document.getElementById('timer-text').classList.remove('warning');

                SFX.playLevelInit();

                // 1. Determine level framing
                recalcLayout();
                const gameplayZoom = targetCam.zoom;

                updateLivesUI(); updateArrowsLeftUI(activeArrowsCount);

                // 2. Set initial camera for build phase
                camera.x = targetCam.x; camera.y = targetCam.y;
                camera.zoom = gameplayZoom * 0.6;
                targetCam.zoom = camera.zoom; // Hold zoom during build

                document.getElementById('canvas-wrap').classList.add('ready');

                await entranceAnim();

                // 3. Glide zoom into gameplay framing
                targetCam.zoom = gameplayZoom;
                isEntranceFinished = true;
                await showIntroTip();
                canInteract = true;
                // Idle countdown starts only now, right as the tip has fully vanished.
                resetIdleHint();
                if (isTimerActive) timerInterval = setInterval(tickTimer, 100);
            } catch (e) { console.error("Load failed:", e); }
        }

        // ═══════════════════════════════════════════════════════════════════
        //  IDLE FINGER HINT
        // ═══════════════════════════════════════════════════════════════════
        function scheduleIdleHint() {
            clearTimeout(idleHintTimer);
            idleHintTimer = null;
            if (!canInteract) return;
            idleHintTimer = setTimeout(triggerIdleHint, IDLE_HINT_DELAY_MS);
        }

        function triggerIdleHint() {
            idleHintTimer = null;
            if (!canInteract) return;
            const candidates = [];
            for (let i = 0; i < arrowList.length; i++) {
                const a = arrowList[i];
                if (a.gone || a.isMoving) continue;
                if (depTree.isFree(a) || a.canMoveForward()) candidates.push(a);
            }
            if (!candidates.length) return;
            idleHintArrow = candidates[Math.floor(Math.random() * candidates.length)];
            const el = document.getElementById('finger-hint');
            el.classList.add('visible');
            el.setAttribute('aria-hidden', 'false');
            updateFingerHintPosition();
        }

        function hideFingerHint() {
            idleHintArrow = null;
            const el = document.getElementById('finger-hint');
            el.classList.remove('visible');
            el.setAttribute('aria-hidden', 'true');
        }

        // Hides any hint currently shown and restarts the 3s idle countdown from now.
        function resetIdleHint() {
            hideFingerHint();
            scheduleIdleHint();
        }

        // Stops the idle-hint system entirely (game over / win / not interactable).
        function clearIdleHint() {
            clearTimeout(idleHintTimer);
            idleHintTimer = null;
            hideFingerHint();
        }

        let fingerHintLastX = -1e9, fingerHintLastY = -1e9;
        function updateFingerHintPosition() {
            if (!idleHintArrow || idleHintArrow.gone) { hideFingerHint(); return; }
            const segs = idleHintArrow.getVisualPositions();
            if (!segs || !segs.length) return;
            const headScreen = segs[segs.length - 1];
            const x = canvasRect.left + headScreen.x * (canvasRect.width / viewW);
            const y = canvasRect.top + headScreen.y * (canvasRect.height / viewH);
            // Writing the same left/top re-dirties style + layout every frame.
            if (Math.abs(x - fingerHintLastX) < 0.5 && Math.abs(y - fingerHintLastY) < 0.5) return;
            fingerHintLastX = x; fingerHintLastY = y;
            const el = document.getElementById('finger-hint');
            el.style.left = x + 'px';
            el.style.top = y + 'px';
        }

        function showIntroTip() {
            return new Promise(resolve => {
                const tip = document.getElementById('tip-overlay');
                tip.setAttribute('aria-hidden', 'false');
                tip.classList.add('visible');
                setTimeout(() => {
                    tip.classList.remove('visible');
                    tip.setAttribute('aria-hidden', 'true');
                    const onFadeDone = (e) => {
                        if (e.propertyName !== 'opacity') return;
                        tip.removeEventListener('transitionend', onFadeDone);
                        resolve();
                    };
                    tip.addEventListener('transitionend', onFadeDone);
                }, 2000);
            });
        }

        function materializeAllArrows() {
            for (let i = 0; i < arrowList.length; i++) {
                const a = arrowList[i];
                a.isGrowing = false;
                a.growthT = 1;
                a.segments = a.pathData.map(s => ({ x: s.x, y: s.y }));
                for (let j = 0; j < a.segments.length; j++) registerOcc(a.segments[j].x, a.segments[j].y, a.id);
            }
            depTree.build();
            invalidateStaticLayer();
            sceneDirty = true;
        }

        async function entranceAnim() {
            // Unity LevelManager: UseInstantEntrance on low-end devices
            if (USE_INSTANT_ENTRANCE) {
                materializeAllArrows();
                return;
            }
            return new Promise(resolve => {
                let start = Date.now();
                const totalDur = IS_LOW_END ? 280 : 500;
                arrowList.forEach(a => { a.isGrowing = true; a.growthT = 0; a.segments = []; });
                function tick() {
                    let elapsed = Date.now() - start;
                    let t = Math.min(1, elapsed / totalDur);
                    arrowList.forEach(a => { a.growthT = t; });
                    if (t < 1) requestAnimationFrame(tick);
                    else {
                        materializeAllArrows();
                        resolve();
                    }
                }
                requestAnimationFrame(tick);
            });
        }

        function recalcLayout() {
            if (!arrowList || arrowList.length === 0) {
                targetCam.x = (gridSize.x * 0.5) * cellSize; targetCam.y = (gridSize.y * 0.5) * cellSize;
                targetCam.zoom = 1.0;
                return;
            }
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            arrowList.forEach(a => a.pathData.forEach(p => {
                minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
                minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
            }));
            const w = (maxX - minX + 1) * cellSize, h = (maxY - minY + 1) * cellSize;
            const ww = Math.max(viewW || canvas.width, 100), hh = Math.max(viewH || canvas.height, 100);
            targetCam.zoom = Math.max(0.01, Math.min((ww - 60) / w, (hh - 60) / h, 1.5));
            targetCam.x = (minX + maxX + 1) * 0.5 * cellSize; targetCam.y = (minY + maxY + 1) * 0.5 * cellSize;
        }

        // Same red edge vignette as the mistake flash, pulsed slowly once per game-second.
        function updateUrgencyFlash() {
            const el = document.getElementById('urgency-flash');
            if (!isTimerActive || currentTime <= 0 || currentTime > 5) {
                el.style.opacity = '0';
                return;
            }
            const frac = currentTime % 1;
            const soft = Math.pow(Math.sin(frac * Math.PI), 0.85);
            el.style.opacity = String(0.22 + 0.78 * soft);
        }

        function gridToScreenInto(gx, gy, out) {
            out.x = viewW * 0.5 + (gx * cellSize + cellSize * 0.5 - camera.x) * camera.zoom;
            out.y = viewH * 0.5 - (gy * cellSize + cellSize * 0.5 - camera.y) * camera.zoom;
            return out;
        }
        function gridToScreen(gx, gy) {
            return gridToScreenInto(gx, gy, { x: 0, y: 0 });
        }

        // Restarts a CSS animation without forcing a synchronous layout (no offsetWidth read).
        // A forced reflow here landed on the exact frame an arrow starts moving and caused a hitch.
        function restartAnimClass(el, ...classes) {
            el.classList.remove(...classes);
            requestAnimationFrame(() => {
                requestAnimationFrame(() => el.classList.add(...classes));
            });
        }

        function showVibe() {
            const vibes = [
                { t: 'GOOD!', s: 'good' },
                { t: 'NICE!', s: 'nice' },
                { t: 'PERFECT!', s: 'perfect' },
                { t: 'EXCELLENT!', s: 'excellent' },
                { t: 'AMAZING!', s: 'amazing' }
            ];
            const v = vibes[Math.floor(Math.random() * vibes.length)];
            const el = document.getElementById('vibe-text');
            el.textContent = v.t;
            SFX.playVibe(v.s);
            restartAnimClass(el, 'show', 'punch');
            if (vibeTimer) clearTimeout(vibeTimer);
            vibeTimer = setTimeout(() => el.classList.remove('show'), 1200);
        }

        function showComboFeedback(n) {
            const el = document.getElementById('combo-text');
            el.textContent = `Combo ${n}`;
            const COMBO_COLORS = ['#eb4d4b', '#f0932b', '#130f40', '#be2edd', '#6ab04c', '#f9ca24'];
            el.style.color = COMBO_COLORS[Math.floor(Math.random() * COMBO_COLORS.length)];
            const qs = [
                { t: '25%', l: '30%' },
                { t: '25%', l: '70%' },
                { t: '70%', l: '30%' },
                { t: '70%', l: '70%' }
            ];
            const q = qs[Math.floor(Math.random() * qs.length)];
            el.style.top = q.t; el.style.left = q.l;
            restartAnimClass(el, 'show', 'punch');
            if (comboTimer) clearTimeout(comboTimer);
            comboTimer = setTimeout(() => el.classList.remove('show'), 800);
        }

        function onArrowClicked(a) {
            if (a.isMoving || a.gone) return;
            if (a.canMoveForward()) {
                a.isMoving = true;
                SFX.playArrowSelect();
                a.startSuccessAnim();

                // Combo Logic
                const now = Date.now();
                if (now - lastSuccessTime < 1000) {
                    comboCount++;
                } else {
                    comboCount = 1;
                }
                lastSuccessTime = now;

                if (comboCount > 1) {
                    SFX.playStreak(comboCount - 1);
                    showComboFeedback(comboCount);
                }

                // Vibe Logic (mod 4 like Unity's specific checks)
                if (comboCount > 0 && comboCount % 4 === 0) {
                    showVibe();
                }

                // Like Logic (12% chance like Unity)
                if (Math.random() < 0.12) {
                    SFX.playLike();
                }

                activeArrowsCount--; updateArrowsLeftUI(activeArrowsCount);
                if (activeArrowsCount <= 0) setTimeout(() => {
                    isWinning = true;
                    stopTimer();
                    canInteract = false;
                    clearIdleHint();
                    SFX.playWin();
                    showEndScreen();
                }, 400);
                invalidateStaticLayer();
                depTree.onStartedMoving(a);
                a._autoStep = true;
                a.tryStep();
            } else {
                a.isMoving = true;
                a.isShowingHint = false;
                comboCount = 0;
                invalidateStaticLayer();

                let lostLastLife = false;
                if (!a.hasReducedLife) {
                    a.hasReducedLife = true;
                    a.markAsMistake();
                    lives--;
                    updateLivesUI();
                    lostLastLife = lives <= 0;
                }

                runBlockedArrowAnimation(a).then(() => {
                    a.isMoving = false;
                    if (lostLastLife) handleGameOver(false);
                });
            }
        }

        // Walks the arrow forward through any free cells until it truly hits the obstacle,
        // bumps into it (turning red exactly on impact), then retraces its steps back to start.
        function runBlockedArrowAnimation(a) {
            return new Promise(resolve => {
                const history = a.simulateForwardHistory();
                a._animQueue = {
                    history,
                    idx: 0,
                    phase: 'forward',
                    impactWait: 0,
                    resolve
                };
                if (history.length > 1) {
                    a._animQueue.idx = 1;
                    a.animateSegmentsTo(history[1]);
                } else {
                    a._animQueue.phase = 'impact';
                    a._animQueue.impactWait = IMPACT_PAUSE_S;
                    SFX.playMistake();
                    flashWrong();
                    a.startBlockedAnim();
                    a.startBounceAnim();
                }
            });
        }

        let endTypeTimer = null;
        let downloadPumpInterval = null;
        const END_TITLE = 'Arrows Legend';
        const TYPE_MS_PER_CHAR = 95;

        function stopEndTypewriter() {
            if (endTypeTimer) { clearTimeout(endTypeTimer); endTypeTimer = null; }
            stopDownloadPump();
        }

        function startDownloadPump() {
            stopDownloadPump();
            const el = document.querySelector('.end-download-btn');
            const pump = () => restartAnimClass(el, 'pump');
            pump();
            downloadPumpInterval = setInterval(pump, 1000);
        }

        function stopDownloadPump() {
            if (downloadPumpInterval) { clearInterval(downloadPumpInterval); downloadPumpInterval = null; }
            const el = document.querySelector('.end-download-btn');
            if (el) el.classList.remove('pump');
        }

        function startEndTypewriter() {
            const el = document.getElementById('end-typewriter');
            stopEndTypewriter();
            el.textContent = '';
            el.classList.remove('done');
            let i = 0;
            // Brief pause so the end screen can fade in, then type at writing speed
            endTypeTimer = setTimeout(function typeNext() {
                if (i <= END_TITLE.length) {
                    el.textContent = END_TITLE.slice(0, i);
                    i++;
                    const delay = i === 1 ? 0 : (END_TITLE[i - 2] === ' ' ? TYPE_MS_PER_CHAR * 1.6 : TYPE_MS_PER_CHAR);
                    endTypeTimer = setTimeout(typeNext, delay);
                } else {
                    el.classList.add('done');
                    endTypeTimer = null;
                    startDownloadPump();
                }
            }, 420);
        }

        function showEndScreen() {
            // Clear gameplay surface and present end card (search + CTA below)
            clearIdleHint();
            hideFingerHint();
            document.getElementById('canvas-wrap').style.visibility = 'hidden';
            document.getElementById('hud').style.visibility = 'hidden';
            document.getElementById('streak-bar').style.visibility = 'hidden';
            document.getElementById('tip-overlay').classList.remove('visible');
            document.getElementById('time-up-msg').classList.remove('visible');
            document.getElementById('end-screen').classList.add('visible');
            startEndTypewriter();
        }

        function openStoreCTA() {
            try {
                if (typeof ExitApi !== 'undefined' && ExitApi.exit) ExitApi.exit();
            } catch (e) { }
        }

        (function wireCTA() {
            const btn = document.getElementById('cta-btn');
            if (!btn) return;
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                openStoreCTA();
            });
        })();

        function showTimeUpThenEnd() {
            const msg = document.getElementById('time-up-msg');
            msg.setAttribute('aria-hidden', 'false');
            msg.classList.add('visible');
            setTimeout(() => {
                msg.classList.remove('visible');
                msg.setAttribute('aria-hidden', 'true');
                setTimeout(showEndScreen, 400);
            }, 1800);
        }

        function stopTimer() {
            isTimerActive = false;
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function handleGameOver(isTimeUp) {
            canInteract = false;
            clearIdleHint();
            stopTimer();
            updateUrgencyFlash();
            if (isTimeUp) showTimeUpThenEnd();
            else showEndScreen();
        }

        // 10% faster than real time: 60 game seconds ≈ 54 real seconds
        const TIMER_SPEED = 1.1;
        function tickTimer() {
            currentTime -= 0.1 * TIMER_SPEED;
            if (currentTime <= 0) {
                currentTime = 0;
                updateTimerDisplay();
                handleGameOver(true);
                return;
            }
            updateTimerDisplay();
        }
        function updateTimerDisplay() {
            const s = Math.ceil(currentTime);
            const m = String(Math.floor(s / 60)).padStart(2, '0');
            const sec = String(s % 60).padStart(2, '0');
            const el = document.getElementById('timer-text');
            el.textContent = `${m}:${sec}`;
            el.classList.toggle('warning', isTimerActive && currentTime > 0 && currentTime <= 5);
            updateUrgencyFlash();
        }
        function updateLivesUI() { for (let i = 0; i < 3; i++) document.getElementById(`heart-${i}`).classList.toggle('inactive', i >= lives); }
        function updateArrowsLeftUI(n) { const el = document.getElementById('arrows-left-text'); el.textContent = n; restartAnimClass(el, 'punch-simple'); }
        function flashWrong() { const el = document.getElementById('wrong-flash'); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 220); }
        function lerpColor(a, b, t) { const h2r = (h) => { let r = 0, g = 0, b = 0; if (h.length == 4) { r = parseInt(h[1] + h[1], 16); g = parseInt(h[2] + h[2], 16); b = parseInt(h[3] + h[3], 16); } else { r = parseInt(h.slice(1, 3), 16); g = parseInt(h.slice(3, 5), 16); b = parseInt(h.slice(5, 7), 16); } return { r, g, b }; }; const c1 = h2r(a), c2 = h2r(b); return `rgb(${Math.round(c1.r + (c2.r - c1.r) * t)},${Math.round(c1.g + (c2.g - c1.g) * t)},${Math.round(c1.b + (c2.b - c1.b) * t)})`; }
        function restartLevel() { location.reload(); }

        let lastTime = 0;
        let fingerHintFrame = 0;
        let sceneDirty = true;
        let wasSceneDirty = true;

        // Reused every frame — avoids a fresh array + a second isArrowDynamic scan just to draw.
        const dynamicArrowsBuf = [];

        function gameLoop(ts) {
            const dt = Math.min((ts - lastTime) / 1000, 0.1); lastTime = ts;
            camera.x += (targetCam.x - camera.x) * CAM_LERP;
            camera.y += (targetCam.y - camera.y) * CAM_LERP;
            camera.zoom += (targetCam.zoom - camera.zoom) * CAM_LERP;

            dynamicArrowsBuf.length = 0;
            for (let i = 0; i < arrowList.length; i++) {
                const a = arrowList[i];
                a.update(dt);
                const dyn = !a.gone && isArrowDynamic(a);
                if (dyn) dynamicArrowsBuf.push(a);
                // Arrow just came to rest (or escaped): fold it into the bake once.
                if (a._wasDynamic && !dyn) boardTexValid = false;
                a._wasDynamic = dyn;
            }

            const camBusy = !cameraSettled();
            const dirty = sceneDirty || camBusy || dynamicArrowsBuf.length > 0;
            if (dirty || wasSceneDirty) {
                sceneDirty = false;

                if (!boardTexValid) rebuildBoardTex();
                else if (!camBusy && activePointers.size === 0) {
                    // Quality-only rebake, at most once after a zoom gesture ends.
                    const want = desiredBakeScale();
                    if (want > boardBakeScale * 1.3 || want < boardBakeScale * 0.7) rebuildBoardTex();
                }

                ctx2d.setTransform(currentDpr, 0, 0, currentDpr, 0, 0);
                ctx2d.fillStyle = '#ffffff';
                ctx2d.fillRect(0, 0, viewW, viewH);
                // One blit moves the whole baked board with the camera.
                const worldH = gridSize.y * cellSize;
                const s = camera.zoom / boardBakeScale;
                ctx2d.translate(viewW * 0.5 - camera.x * camera.zoom, viewH * 0.5 - (worldH - camera.y) * camera.zoom);
                ctx2d.scale(s, s);
                ctx2d.drawImage(boardTex, 0, 0);
                ctx2d.setTransform(currentDpr, 0, 0, currentDpr, 0, 0);
                for (let i = 0; i < dynamicArrowsBuf.length; i++) dynamicArrowsBuf[i].draw(ctx2d);
            }
            if (idleHintArrow) {
                fingerHintFrame++;
                if ((fingerHintFrame & 1) === 0) updateFingerHintPosition();
            }
            wasSceneDirty = dirty;
            requestAnimationFrame(gameLoop);
        }

        function markSceneDirty() { sceneDirty = true; invalidateStaticLayer(); }

        window.addEventListener('resize', () => { resizeGameCanvas(); recalcLayout(); markSceneDirty(); });
        resizeGameCanvas();
        (async () => {
            await fetchLevelData();
            resizeGameCanvas();
            const buildPromise = loadLevel();
            document.activeElement?.blur();
            document.getElementById('loading').classList.add('hidden');
            markSceneDirty();
            requestAnimationFrame(ts => { lastTime = ts; gameLoop(ts); });
            await buildPromise;
        })();
    </script>
</body>
